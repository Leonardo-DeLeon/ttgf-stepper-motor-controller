name: gds

run-name: GF180 C01 · ${{ github.ref_name }} · ${{ github.sha }}
on: workflow_dispatch

permissions:
  contents: read

jobs:
  gds:
    if: github.ref == 'refs/heads/experiment/stage4a-electrical'
    runs-on: ubuntu-24.04
    outputs:
      tools_sha: ${{ steps.preflight.outputs.tools_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify variant and pinned Tiny Tapeout tooling
        id: preflight
        shell: bash
        run: |
          python3 experiments/stage4a/verify.py inputs
          tools_sha=$(jq -er '.tools_sha | select(test("^[0-9a-f]{40}$"))' experiments/stage4a/manifest.json)
          printf 'tools_sha=%s\n' "$tools_sha" >> "$GITHUB_OUTPUT"
          python3 experiments/stage4a/verify.py identify "$tools_sha" > stage4a-run.json
          cat stage4a-run.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build GDS
        id: build
        uses: TinyTapeout/tt-gds-action@df73a1e7b52e940423ff55f9354b2b8140d38cb7
        with:
          pdk: gf180mcuD
          librelane-version: '3.0.14'
          tools-ref: ${{ steps.preflight.outputs.tools_sha }}
      - name: Check resolved configuration and record physical metrics
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          actual_tools_sha=$(git -C tt rev-parse HEAD || true)
          python3 experiments/stage4a/verify.py run "$BUILD_OUTCOME" "$actual_tools_sha"
      - name: Archive provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage4a-provenance
          path: |
            stage4a-run.json
            stage4a-physical.json
            experiments/stage4a/manifest.json
      - name: Archive available files from a failed build
        if: failure() && steps.preflight.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: stage4a-failed-flow
          path: |
            src/
            runs/wokwi/

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: TinyTapeout/tt-gds-action/precheck@df73a1e7b52e940423ff55f9354b2b8140d38cb7
        with:
          tools-ref: ${{ needs.gds.outputs.tools_sha }}

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: TinyTapeout/tt-gds-action/gl_test@df73a1e7b52e940423ff55f9354b2b8140d38cb7
        with:
          test-dir: test
