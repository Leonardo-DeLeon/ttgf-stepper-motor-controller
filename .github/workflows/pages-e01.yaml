name: E01 GitHub Pages

on:
  push:
    branches:
      - experiment/stage6-bootcamp-preview

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Leonardo-DeLeon/ttgf-stepper-motor-controller' && github.ref == 'refs/heads/experiment/stage6-bootcamp-preview'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify and stage the reviewed E01 files
        working-directory: preview
        shell: bash
        run: |
          printf '%s\n' layout.gds layout.oas layout.png datasheet.pdf |
            diff -u - <(cut -c 67- SHA256SUMS)
          sha256sum --check --strict SHA256SUMS
          for file in index.html LICENSE NOTICE; do
            test -s "$file"
          done
          site="$RUNNER_TEMP/e01-pages"
          install -d "$site"
          install -m 0644 -t "$site" index.html layout.gds layout.oas layout.png datasheet.pdf LICENSE NOTICE SHA256SUMS
          (cd "$site" && sha256sum --check --strict SHA256SUMS)
      - name: Upload the GitHub Pages artifact
        if: vars.BOOTCAMP_PAGES_SHA == github.sha
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/e01-pages
          name: github-pages-${{ github.run_attempt }}

  deploy:
    if: github.repository == 'Leonardo-DeLeon/ttgf-stepper-motor-controller' && github.ref == 'refs/heads/experiment/stage6-bootcamp-preview' && vars.BOOTCAMP_PAGES_SHA == github.sha
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
