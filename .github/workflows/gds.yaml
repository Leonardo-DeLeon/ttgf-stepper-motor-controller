name: E01 compact independent signoff
run-name: E01 final views signoff · ${{ github.sha }}
on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  signoff:
    if: github.ref == 'refs/heads/experiment/stage5-compact' && github.repository == 'Leonardo-DeLeon/ttgf-stepper-motor-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      E01_REPORT: ${{ github.workspace }}/e01-signoff-evidence
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Recover authenticated E01 views and historical RTL
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$E01_REPORT"
          set -o pipefail
          bash experiments/stage5/signoff.sh recover "$RUNNER_TEMP/e01-signoff" 2>&1 | tee "$E01_REPORT/recovery.log"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'

      - name: Provision KLayout 0.30.14 and its Python API
        id: klayout
        if: ${{ !cancelled() && steps.recover.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install klayout==0.30.14
          deb="$RUNNER_TEMP/klayout_0.30.14-1_amd64.deb"
          curl --fail --location --silent --show-error \
            https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.14-1_amd64.deb -o "$deb"
          md5=$(python3 experiments/stage5/recover_signoff.py field runtime.klayout_package_md5)
          printf '%s  %s\n' "$md5" "$deb" | md5sum -c -
          sha256sum "$deb" > "$E01_REPORT/klayout-package.sha256"
          sudo apt-get update
          sudo apt-get install -y "$deb"

      - name: Provision fixed GF180D DRC deck
        id: deck
        if: ${{ !cancelled() && steps.recover.outcome == 'success' }}
        uses: TinyTapeout/ciel-action@7ac3e42cf2e1a080f1fc6d7b56d732a2ad17d9f6
        with:
          pdk_name: gf180mcuD
          pdk_root: ${{ runner.temp }}/e01-deck-pdk
          pdk_version: e8daeda73ca8f5814dbc0b11d1d05802251a3750
          ciel_version: '3.2.0'

      - name: KLayout DRC geometry, antenna and density
        if: ${{ !cancelled() && steps.klayout.outcome == 'success' && steps.deck.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          bash experiments/stage5/signoff.sh drc "$RUNNER_TEMP/e01-signoff" \
            "$RUNNER_TEMP/e01-deck-pdk/gf180mcuD" 2>&1 | tee "$E01_REPORT/drc-step.log"

      - name: Convert the authenticated GDSII to OASIS
        if: ${{ !cancelled() && steps.klayout.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          bash experiments/stage5/signoff.sh oasis "$RUNNER_TEMP/e01-signoff" 2>&1 | tee "$E01_REPORT/oasis-step.log"

      - name: Provision fixed GF180D simulation models
        id: models
        if: ${{ !cancelled() && steps.recover.outcome == 'success' }}
        uses: TinyTapeout/ciel-action@7ac3e42cf2e1a080f1fc6d7b56d732a2ad17d9f6
        with:
          pdk_name: gf180mcuD
          pdk_root: ${{ runner.temp }}/e01-implementation-pdk
          pdk_version: 54435919abffb937387ec956209f9cf5fd2dfbee
          ciel_version: '3.2.0'

      - name: Provision Icarus 13.0 and cocotb 2.1.0
        id: simulator
        if: ${{ !cancelled() && steps.recover.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          deb="$RUNNER_TEMP/iverilog_13.0-1_amd64.deb"
          curl --fail --location --silent --show-error \
            https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb -o "$deb"
          sha256sum "$deb" > "$E01_REPORT/iverilog-package.sha256"
          sudo apt-get update
          sudo apt-get install -y "$deb"
          python3 -m pip install -r test/requirements.txt

      - name: Functional Gate Level on E01 powered netlist
        if: ${{ !cancelled() && steps.models.outcome == 'success' && steps.simulator.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          bash experiments/stage5/signoff.sh gl "$RUNNER_TEMP/e01-signoff" \
            "$RUNNER_TEMP/e01-implementation-pdk" 2>&1 | tee "$E01_REPORT/gl-step.log"

      - name: Verify all archived and independent signoff results
        if: ${{ !cancelled() && steps.recover.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          bash experiments/stage5/signoff.sh finalize "$RUNNER_TEMP/e01-signoff" 2>&1 | tee "$E01_REPORT/signoff-step.log"

      - name: Preserve reports for this attempt
        if: always()
        shell: bash
        run: |
          mkdir -p "$E01_REPORT"
          root="$RUNNER_TEMP/e01-signoff"
          for item in "$root"/actions "$root"/signoff "$root"/*.json "$root"/*.SHA256SUMS; do
            if [[ -e "$item" ]]; then cp -r "$item" "$E01_REPORT/"; fi
          done
          python3 experiments/stage5/prepare.py seal "$E01_REPORT"

      - name: Upload reports even when signoff fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e01-signoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: e01-signoff-evidence/
          if-no-files-found: error
